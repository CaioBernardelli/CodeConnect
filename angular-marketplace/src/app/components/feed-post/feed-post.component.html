<div class="container">
    <div class="row mt-5 mb-5">
      <div class="col-md-4">
        <mat-card class="mat-elevation-z4">
          <div class="d-flex justify-content-center">
            <img
              src="https://i.im.ge/2024/07/26/VpM4DL.WhatsApp-Image-2024-01-31-at-21-39-52.jpeg"
              class="rounded-circle" alt="Imagem do produto" style="width: 150px;">
          </div>
          <mat-card-content>
            <h5 class="text-center">Caio Bernardelli Quirino</h5>
            <p class="text-center">Desenvolvedor de Software</p>
            <div class="d-flex justify-content-center">
              <a mat-raised-button href="#" target="_blank" class="mat-primary">Github</a>
            </div>
            <mat-divider class="mt-4 mb-4"></mat-divider>
            <h6 class="mb-3 text-center">Pesquisar por título</h6>
            <mat-form-field appearance="fill" class="w-100">
              <mat-label>Pesquisar</mat-label>
              <input matInput type="text">
            </mat-form-field>
            <button mat-raised-button color="warn" class="w-100">Pesquisar</button>
          </mat-card-content>
        </mat-card>
      </div>
  
      <div class="col-md-8">
        <form [formGroup]="postForm" (ngSubmit)="publicarMensagem()">
          <h3 class="text-center mb-4">Digite abaixo seus comentários</h3>
  
          <mat-form-field class="w-100">
            <mat-label>Mensagem</mat-label>
            <textarea matInput id="mensagem" formControlName="mensagem" rows="4" placeholder="Digite a sua mensagem"></textarea>
            <mat-error *ngIf="postForm.get('mensagem')?.invalid && postForm.get('mensagem')?.touched">
              Mensagem é obrigatória e deve ter pelo menos 10 caracteres.
            </mat-error>
          </mat-form-field>
  
          <div class="d-flex justify-content-center mt-4">
            <button mat-raised-button color="primary" type="submit" [disabled]="postForm.invalid">Publicar</button>
          </div>
        </form>
  
        <mat-divider class="mt-5 mb-5"></mat-divider>
        <h3 class="text-center mb-5">Comentários adicionados</h3>
  
        <div class="container">
          <mat-card *ngFor="let postagem of listPost" class="mb-4 mat-elevation-z2">
            <mat-card-header>
              <mat-card-title class="text-center">{{postagem.id}}</mat-card-title>
            </mat-card-header>
            <mat-card-content>
              <p>{{postagem.message}}</p>
            </mat-card-content>
            <div class="buttons d-flex justify-content-center">
              <!-- Botão para remover -->
              <button mat-icon-button color="warn" (click)="remover(postagem)">
                <mat-icon>delete</mat-icon>
              </button>
              <!-- Botão para alterar -->
            </div>
          </mat-card>
        </div>
      </div>
    </div>
  </div>
