<div class="container">
    <div class="row mt-5 mb-5">
      <div class="col-md-4">
        <mat-card class="mat-elevation-z4">
          <div class="d-flex justify-content-center">
            <img
              src="https://i.im.ge/2024/07/26/VpM4DL.WhatsApp-Image-2024-01-31-at-21-39-52.jpeg"
              class="rounded-circle" alt="Imagem do produto" style="width: 150px;">
          </div>
          <mat-card-content>
            <h5 class="text-center">Caio Bernardelli Quirino</h5>
            <p class="text-center">Desenvolvedor de Software</p>
            <div class="d-flex justify-content-center">
              <a mat-raised-button href="#" target="_blank" class="mat-primary">Github</a>
            </div>
            <mat-divider class="mt-4 mb-4"></mat-divider>
            <h6 class="mb-3 text-center">Pesquisar por título</h6>
            <mat-form-field appearance="fill" class="w-100">
              <mat-label>Pesquisar</mat-label>
              <input matInput type="text">
            </mat-form-field>
            <button mat-raised-button color="warn" class="w-100">Pesquisar</button>
          </mat-card-content>
        </mat-card>
      </div>
  
      <div class="col-md-8">
        <mat-card class="mat-elevation-z4 p-4">
          <h3 class="text-center mb-4">Deixe seu comentário</h3>
      
          <form [formGroup]="postForm" (ngSubmit)="publicarMensagem()">
            <mat-form-field class="w-100">
              <mat-label>Escreva sua mensagem</mat-label>
              <textarea matInput id="mensagem" formControlName="mensagem" rows="4" 
                        placeholder="Compartilhe sua opinião..."></textarea>
              <mat-error *ngIf="postForm.get('mensagem')?.invalid && postForm.get('mensagem')?.touched">
                Mensagem é obrigatória e deve ter pelo menos 10 caracteres.
              </mat-error>
            </mat-form-field>
      
            <div class="d-flex justify-content-center mt-4">
              <button mat-raised-button color="primary" type="submit" [disabled]="postForm.invalid">
                <mat-icon>send</mat-icon> Publicar
              </button>
            </div>
          </form>
        </mat-card>
      
        <mat-divider class="mt-5 mb-5"></mat-divider>
      
        <h3 class="text-center mb-5">Comentários adicionados</h3>
      
        <div class="container">
          <mat-card *ngFor="let postagem of listPost" class="mb-4 mat-elevation-z2 p-3">
            <mat-card-header class="d-flex align-items-center">
              <img src="https://i.pravatar.cc/40" class="rounded-circle me-2" alt="Avatar do usuário">
              <mat-card-title class="m-0">{{postagem.id}}</mat-card-title>
            </mat-card-header>
            <mat-card-content>
              <p>{{postagem.message}}</p>
            </mat-card-content>
            <div class="buttons d-flex justify-content-end">
              <button mat-icon-button color="warn">
                <mat-icon>delete</mat-icon>
              </button>
            </div>
          </mat-card>
        </div>
      </div>
