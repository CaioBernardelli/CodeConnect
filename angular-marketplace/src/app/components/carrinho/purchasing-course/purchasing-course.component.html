<div class="container">
  <mat-card class="mat-car-main mat-elevation-z4">
    <div class="title-card">
      <mat-card-title>
        <h2>Carrinho de Compras</h2>
      </mat-card-title>
    </div>

    <mat-card *ngIf="listSelectedCourses.length > 0">
      <h2>Cursos Selecionados: {{ listSelectedCourses.length }}</h2>

      <div>
        <mat-card class="mat-card-course" *ngFor="let course of listSelectedCourses">
          <mat-card-content class="mat-card-content">
            <div class="container-esquerda">
              <img [src]="course.imgLink" class="image-small" />
              <mat-card-title>
                <h2>{{ course.name }}</h2>
              </mat-card-title>
            </div>
            <div class="container-direita">
              <mat-card-subtitle>
                <h2>Preço: R$ {{ course.price }}</h2>
              </mat-card-subtitle>
              <button mat-flat-button color="warn" (click)="excluir(course)">Remover</button>
            </div>
          </mat-card-content>
        </mat-card>
      </div>

      <mat-card class="mat-form">
        <h1>Total: R$ {{ totalPrice }}</h1>
        <button mat-raised-button color="warn" (click)="excluirTudo()">Esvaziar Carrinho</button>
        <button mat-raised-button color="primary" (click)="finalizarCompra()">Finalizar Compra</button>
      </mat-card>
    </mat-card>

    <mat-card *ngIf="listSelectedCourses.length === 0">
      <mat-card-title>
        <h2>Nenhum curso selecionado</h2>
      </mat-card-title>
    </mat-card>
  </mat-card>
</div>
